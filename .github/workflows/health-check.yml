name: Scheduled Health Check

# Controls when the action will run.
on:
  schedule:
    # Off the hour to avoid peak load drops; minute change also reactivates a stopped schedule.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  health_check_job:
    runs-on: ubuntu-latest
    name: Check all sites
    steps:
      - uses: actions/checkout@v4
      - name: Run Shell Script
        id: shell_script_run
        run: bash ./health-check.sh
